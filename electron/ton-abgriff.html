<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'" />
    <title>L.O.K.I. – PC-Ton</title>
    <!-- Unsichtbares Fenster (05.11.2026, electron/tonabgriff.cjs): hört den PC-Ausgang ab (Windows-Loopback) und schickt
         nur die Lautstärke von 64 Tonbereichen (ca. 30-mal je Sekunde) an L.O.K.I. – kein Ton wird gespeichert oder
         weitergegeben. Grund: Wallpaper Engine lieferte beim Auftraggeber keine Tondaten. -->
  </head>
  <body>
    <script>
      ;(async () => {
        try {
          const strom = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
          strom.getVideoTracks().forEach((s) => s.stop()) // nur der Ton wird gebraucht
          if (!strom.getAudioTracks().length) { window.tonFenster.meldung('kein-ton'); return }
          const ctx = new AudioContext()
          const quelle = ctx.createMediaStreamSource(new MediaStream(strom.getAudioTracks()))
          const analyse = ctx.createAnalyser(); analyse.fftSize = 256; analyse.smoothingTimeConstant = 0.55
          quelle.connect(analyse) // nicht an die Lautsprecher (sonst doppelt)
          const daten = new Uint8Array(analyse.frequencyBinCount)
          setInterval(() => {
            analyse.getByteFrequencyData(daten)
            window.tonFenster.werte(daten.slice(1, 65)) // 64 Bänder, Bass zuerst
          }, 33)
        } catch (f) { window.tonFenster.meldung('fehler') }
      })()
    </script>
  </body>
</html>
