<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – PV-Entwürfe</title>
<style>html,body{margin:0;background:#06121a;font:600 18px Bahnschrift,sans-serif;color:#9ef} .feld{display:inline-block;margin:10px} canvas{display:block;border:1px solid #2a5560}</style></head>
<body><div id="wurzel"></div>
<script type="module">
import { ENTWUERFE, BEISPIEL } from './pv-entwuerfe.js'
import { RAHMEN_STILE } from './rahmen.js'
const namen = { a: 'A · Leitstand mit Symbolen', b: 'B · Energiefluss groß', c: 'C · Symbol-Schema', d: 'D · Werte + Tageskurve' }
for (const k of 'abcd') {
  const d = document.createElement('div'); d.className = 'feld'; d.textContent = namen[k]
  const c = document.createElement('canvas'); c.width = 610; c.height = 396; const g = c.getContext('2d')
  g.fillStyle = '#081820'; g.fillRect(0, 0, 610, 396); RAHMEN_STILE[1].zeichne(g, 610, 396); ENTWUERFE[k](g, 610, 396, BEISPIEL)
  d.appendChild(c); document.getElementById('wurzel').appendChild(d)
}
</script></body></html>
