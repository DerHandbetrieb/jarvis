<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – linke Seite, vier Entwürfe</title>
<style>html,body{margin:0;background:#03090d;font:600 18px Bahnschrift,sans-serif;color:#9ef}
.feld{margin:18px 14px 30px} .feld p{margin:4px 0 8px;font-weight:400;font-size:15px;color:#bfe} canvas{display:block;width:100%;max-width:1240px;border:1px solid #2a5560}</style></head>
<body><div id="wurzel"></div>
<script type="module">
import { ENTWUERFE, zeichneEntwurf } from './links-entwuerfe.js'
for (const k of Object.keys(ENTWUERFE)) {
  const d = document.createElement('div'); d.className = 'feld'
  const h = document.createElement('div'); h.textContent = ENTWUERFE[k].name
  const p = document.createElement('p'); p.textContent = ENTWUERFE[k].text
  const c = document.createElement('canvas'); c.id = 'e-' + k
  d.append(h, p, c); document.getElementById('wurzel').appendChild(d)
  document.fonts.ready.then(() => zeichneEntwurf(c, k, 1.5))
}
</script></body></html>
