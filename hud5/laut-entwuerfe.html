<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – Lautstärke-Entwürfe</title>
<style>html,body{margin:0;background:#06121a;font:600 16px Bahnschrift,sans-serif;color:#9ef} .feld{margin:10px 14px} canvas{display:block;width:1240px;height:140px;margin-top:4px}</style></head>
<body><div id="wurzel"></div>
<script type="module">
// Vier Entwürfe für den Lautstärke-Regler (09.11.2026): echtes Audiofeld, flach und ohne Schräge, Werte nur Beispiel
import { ZEICHNER } from './inhalte.js'
import { RAHMEN_STILE } from './rahmen.js'
const NAMEN = { a: 'A · Senkrechter Schieber', b: 'B · Waagerechter Schieber', c: 'C · Drehring', d: 'D · Keil mit Plus und Minus (Empfehlung)' }
const B = 1240, H = 140, FAKTOR = 2, felder = []
for (const k of 'abcd') {
  const d = document.createElement('div'); d.className = 'feld'; d.textContent = NAMEN[k]
  const c = document.createElement('canvas'); c.width = B * FAKTOR; c.height = H * FAKTOR
  d.appendChild(c); document.getElementById('wurzel').appendChild(d); felder.push([k, c.getContext('2d')])
}
const ton = Array.from({ length: 128 }, (_, i) => 0.15 + 0.6 * Math.abs(Math.sin(i * 0.37)) * (1 - (i % 64) / 90))
const medien = { titel: 'Beispieltitel', kuenstler: 'Beispiel-Band', album: 'Beispielalbum', zustand: 'spielt', farbe: '#c2364a', dauer: 214, position: 83, posZeit: performance.now() }
function bild(ms) {
  const t = ms / 1000
  for (const [k, g] of felder) {
    g.setTransform(FAKTOR, 0, 0, FAKTOR, 0, 0); g.clearRect(0, 0, B, H)
    RAHMEN_STILE[1].zeichne(g, B, H)
    ZEICHNER.tonSystemKopf(g, B, H, { lautArt: k, lautstaerke: { wert: 62, stumm: false }, ton, medien, loki: { zustand: 'bereit', mikrofon: true, whatsapp: 0 }, tonStatus: 'STILLE', kamera: { name: 'Hof' }, verbunden: true }, t)
  }
  requestAnimationFrame(bild)
}
requestAnimationFrame(bild)
</script></body></html>
