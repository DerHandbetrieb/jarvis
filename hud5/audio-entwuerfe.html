<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – Audio-Entwürfe</title>
<style>html,body{margin:0;background:#06121a;font:600 18px Bahnschrift,sans-serif;color:#9ef} .feld{margin:14px} canvas{display:block;width:100%;max-width:1150px;border:1px solid #2a5560;margin-top:6px}</style></head>
<body><div id="wurzel"></div>
<script type="module">
// Vier Entwürfe fürs Audiofeld (07.11.2026), gleiche Größe wie das Feld im HUD (flach, ohne Schräge)
import { ENTWUERFE, BEISPIEL, NAMEN } from './audio-entwuerfe.js'
import { RAHMEN_STILE } from './rahmen.js'
const B = 1150, H = 150, felder = []
for (const k of 'abcd') {
  const d = document.createElement('div'); d.className = 'feld'; d.textContent = NAMEN[k]
  const c = document.createElement('canvas'); c.width = B; c.height = H
  d.appendChild(c); document.getElementById('wurzel').appendChild(d); felder.push([k, c.getContext('2d')])
}
function bild(ms) {
  const t = ms / 1000
  for (const [k, g] of felder) { g.clearRect(0, 0, B, H); g.fillStyle = '#081820'; g.fillRect(0, 0, B, H); RAHMEN_STILE[1].zeichne(g, B, H); ENTWUERFE[k](g, B, H, BEISPIEL, t) }
  requestAnimationFrame(bild)
}
requestAnimationFrame(bild)
</script></body></html>
