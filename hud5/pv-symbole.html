<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – PV-Symbole</title>
<style>html,body{margin:0;background:#06121a;font:600 18px Bahnschrift,sans-serif;color:#9ef} .feld{display:inline-block;margin:10px} canvas{display:block}</style></head>
<body><div id="wurzel"></div>
<script type="module">
import { SYMBOL_ENTWUERFE } from './pv-symbole.js'
import { BEISPIEL } from './pv-entwuerfe.js'
import { RAHMEN_STILE } from './rahmen.js'
const namen = { 1: '1 · Haus zentral', 2: '2 · Quellen oben, Verbraucher unten', 3: '3 · Querschnitt (Akku im Haus)', 4: '4 · Kreuz mit Autarkie-Ring' }
for (const k of [1, 2, 3, 4]) {
  const d = document.createElement('div'); d.className = 'feld'; d.textContent = namen[k]
  const c = document.createElement('canvas'); c.width = 800; c.height = 396; const g = c.getContext('2d')
  RAHMEN_STILE[1].zeichne(g, 800, 396); SYMBOL_ENTWUERFE[k](g, 800, 396, BEISPIEL, 0.3)
  d.appendChild(c); document.getElementById('wurzel').appendChild(d)
}
</script></body></html>
