<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>L.O.K.I. – Intro-Entwürfe</title>
    <!-- Vier Intro-Varianten (05.11.2026). Tasten 1–4 = Variante (startet neu), R = noch einmal, Esc beendet (drei Bildschirme). -->
    <style>
      html, body { margin: 0; background: #000; color: #9ef; font: 13px system-ui; overflow: hidden; }
      #flaeche { display: block; width: 100vw; }
      #tafeln { position: absolute; left: 0; top: 0; width: 100vw; height: calc(100vw * 1080 / 5760); }
      #info { position: fixed; left: 8px; top: 6px; background: #000a; padding: 4px 8px; border-radius: 4px; z-index: 5; }
      #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000c; color: #bff; font-size: 20px; z-index: 9; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="info">lädt …</div>
    <div id="start">Klicken zum Starten (Ton braucht einen Klick)</div>
    <div style="position: relative"><canvas id="flaeche" width="5760" height="1080"></canvas><div id="tafeln"></div></div>
    <script type="module" src="./intro-vorschau.js"></script>
  </body>
</html>
