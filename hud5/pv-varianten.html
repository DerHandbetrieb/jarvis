<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /><title>L.O.K.I. – PV-Vorschläge</title>
<style>html,body{margin:0;background:#06121a;font:600 18px Bahnschrift,sans-serif;color:#9ef} .feld{display:inline-block;margin:8px;vertical-align:top} canvas{display:block}</style></head>
<body><div id="wurzel"></div>
<script type="module">
import { PV_VARIANTE } from './pv-varianten.js'
import { ZEICHNER } from './inhalte.js'
import { RAHMEN_STILE } from './rahmen.js'
const pv = { akku: 64, akkuW: -1200, netzW: -850, pvW: 4300, hausW: 2250, zustand: 0, inselbetrieb: false, zeit: Date.now() }
const namen = { a: 'A · Drei Spalten (aktuell im Wallpaper)', b: 'B · Kacheln um den Verbrauch', c: 'C · Fluss links → rechts', d: 'D · Große Zahlen oben' }
for (const k of ['a', 'b', 'c', 'd']) {
  const d = document.createElement('div'); d.className = 'feld'; d.textContent = namen[k]
  const c = document.createElement('canvas'); c.width = 800; c.height = 396; const g = c.getContext('2d')
  RAHMEN_STILE[1].zeichne(g, 800, 396)
  if (k === 'a') ZEICHNER.energie(g, 800, 396, { pv }, 1.3); else PV_VARIANTE[k](g, 800, 396, pv, 1.3)
  d.appendChild(c); document.getElementById('wurzel').appendChild(d)
}
</script></body></html>
