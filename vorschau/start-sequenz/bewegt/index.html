<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start-Sequenz bewegt</title>
<!-- Bewegte Fassung der Auswahl (Stilprobe 9 „Kombination“ + Tongerüst 9), 03.11.2026 – siehe main.js -->
<style>
  :root { --bg: #05070a; --text: #d7dde3; --leise: #7f8a94; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1900px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p { color: var(--leise); margin: 0 0 14px; }
  .buehne { position: relative; width: 100%; aspect-ratio: 16 / 3; background: #000; border-radius: 6px; overflow: hidden; }
  .buehne canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; }
  button { background: #10161d; color: var(--text); border: 1px solid #27313b; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  #fps { position: absolute; left: 8px; bottom: 6px; font: 600 13px Consolas, monospace; color: #9fe; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; z-index: 2; }
  #info { min-height: 1.5em; }
  .buehne:fullscreen { aspect-ratio: auto; border-radius: 0; }
  body.flaeche { overflow: hidden; background: #000; cursor: none; }
  body.flaeche main { max-width: none; padding: 0; }
  body.flaeche h1, body.flaeche p, body.flaeche .knoepfe { display: none; }
  body.flaeche .buehne { position: fixed; inset: 0; aspect-ratio: auto; border-radius: 0; }
</style>
</head>
<body>
<main>
  <h1>Lokis Start-Sequenz – bewegte Fassung (Kombination + Ton 9)</h1>
  <p>Alle drei Bildschirme verkleinert nebeneinander. Ton an, „Abspielen“. Alle Werkstatt-Zahlen sind Beispiele, die Uhrzeit ist echt.</p>
  <div class="buehne" id="buehne"><canvas id="flaeche"></canvas><div id="fps" hidden></div></div>
  <div class="knoepfe"><button id="spielen">▶ Abspielen</button><button id="voll">Vollbild</button></div>
  <p id="info"></p>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
