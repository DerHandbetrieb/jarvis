<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tongerüste Start-Sequenz</title>
<!-- Tongerüste (03.11.2026): acht Klangrichtungen nur zum Anhören, gleiche Zeitachse wie die Start-Sequenz. -->
<style>
  :root { --bg: #070a0e; --karte: #0e141b; --rand: #1f2a35; --text: #d7dde3; --leise: #8592a0; --an: #3fd0e0; --akzent: #ffa640; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p { color: var(--leise); margin: 0 0 16px; }
  .zeitleiste { position: sticky; top: 0; background: var(--bg); padding: 10px 0 14px; z-index: 2; }
  .leiste { position: relative; display: flex; height: 34px; border-radius: 6px; overflow: hidden; border: 1px solid var(--rand); }
  .phase { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--leise); border-right: 1px solid var(--rand); white-space: nowrap; overflow: hidden; }
  .phase.aktiv { background: #12303a; color: var(--text); }
  .marke { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--akzent); left: 0; display: none; }
  .zeile { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--leise); }
  #uhr { font-variant-numeric: tabular-nums; color: var(--text); }
  .karten { display: grid; gap: 10px; }
  .karte { display: flex; gap: 14px; align-items: flex-start; background: var(--karte); border: 1px solid var(--rand); border-radius: 10px; padding: 12px 14px; }
  .karte.spielt { border-color: var(--an); }
  button { flex: none; min-width: 64px; background: #10161d; color: var(--text); border: 1px solid #2b3742; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4a5865; }
  .karte.spielt button { background: #173640; border-color: var(--an); }
  .name { font-weight: 600; }
  .text { color: var(--leise); font-size: 14px; }
  #info { margin-top: 14px; min-height: 1.5em; }
  @media (max-width: 560px) { .phase { font-size: 10px; } }
</style>
</head>
<body>
<main>
  <h1>Tongerüste – nur Ton, 25 Sekunden</h1>
  <p>Acht Klangrichtungen auf derselben Zeitachse wie die Start-Sequenz, mit Lokis Begrüßung. Am besten mit Kopfhörern oder guten Lautsprechern. Die Leiste zeigt, in welchem Abschnitt du gerade bist – dann kannst du sagen „bei Sekunde X gefällt mir …“.</p>
  <div class="zeitleiste">
    <div class="leiste" id="leiste"><div class="marke" id="marke"></div></div>
    <div class="zeile"><span id="phase">–</span><span id="uhr">0,0 s</span></div>
  </div>
  <div class="karten" id="karten"></div>
  <p id="info"></p>
</main>
<script type="module" src="./seite.js"></script>
</body>
</html>
